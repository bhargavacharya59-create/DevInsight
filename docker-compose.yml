version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: devinsight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devinsight
      POSTGRES_PASSWORD: devinsight_pass
      POSTGRES_DB: devinsight_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devinsight -d devinsight_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devinsight-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://devinsight:devinsight_pass@db:5432/devinsight_db
      DATABASE_URL_SYNC: postgresql://devinsight:devinsight_pass@db:5432/devinsight_db
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      OTEL_COLLECTOR_URL: http://otel-collector:4318
      SHOPSPHERE_URL: http://shopsphere-backend:8000
      SHOPSPHERE_METRICS_URL: http://shopsphere-backend:8000/metrics
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:80
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      default: {}
      observability-net:
        aliases:
          - devinsight-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devinsight-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: devinsight-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      default: {}
      observability-net: {}

  loki:
    image: grafana/loki:2.9.4
    container_name: devinsight-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:10.2.4
    container_name: devinsight-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: devinsight_grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: devinsight-otel
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - prometheus
      - loki
    networks:
      default: {}
      observability-net:
        aliases:
          - devinsight-otel

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  observability-net:
    name: observability-net
    external: true

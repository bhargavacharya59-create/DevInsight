global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'devinsight-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # ShopSphere services (configure when available)
  - job_name: 'shopsphere'
    static_configs:
      - targets: ['shopsphere-api:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: job
        replacement: shopsphere
